name: cromomania_2026
description: "CromoManía 2026 - Tu álbum de figuritas digital"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.0
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pdf: ^3.10.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  equatable: ^2.0.5
  # QR Code Generation
  qr_flutter: ^4.1.0

  # QR Code Scanning
  mobile_scanner: ^5.2.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.15.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/album.json
